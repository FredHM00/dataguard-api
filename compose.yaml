services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro da rede do Compose, os vizinhos sao hostnames, nao loopback.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      RATELIMIT_STORAGE_URI: redis://redis:6379
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-dataguard}
    # Publicado SOMENTE em loopback: nao exponha o banco a rede externa.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    # Sem volume de proposito: contadores de rate limit sao efemeros.
    # Perder o estado num restart apenas afrouxa o limite por uma janela.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  caddy_data:
